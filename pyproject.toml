[project]
name = "mcon"
version = "1.3.0"
description = "Multi-tenant agent dashboard"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.10",
    "alien-sso-agent-id",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
alien-sso-agent-id = { path = "../sso-sdk-py/packages/agent-id", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
